name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  REGISTRY: ghcr.io/marcelblanarik

jobs:
  release:
    permissions:
      contents: read
      packages: write
    name: Publish images and chart
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same trick as `make docker-buildx`: compile Go on the build platform instead of under QEMU.
      - name: Prepare the cross-compiling Dockerfile
        run: sed -e '1 s/\(^FROM\)/FROM --platform=\$\{BUILDPLATFORM\}/; t' -e ' 1,// s//FROM --platform=\$\{BUILDPLATFORM\}/' Dockerfile > Dockerfile.cross

      - name: Build and push the operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.cross
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/webaudit-operator:${{ env.VERSION }}
            ${{ env.REGISTRY }}/webaudit-operator:latest

      - name: Build and push the audit image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/lighthouse
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/webaudit-lighthouse:${{ env.VERSION }}
            ${{ env.REGISTRY }}/webaudit-lighthouse:latest

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # The chart's manager image tag defaults to appVersion, so --app-version pins the operator image.
      # The audit image is pinned by rewriting defaultAuditImage in a copy of the chart.
      - name: Package and push the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -r dist/chart "$RUNNER_TEMP/chart"
          sed -i "s|^defaultAuditImage:.*|defaultAuditImage: $REGISTRY/webaudit-lighthouse:$VERSION|" "$RUNNER_TEMP/chart/values.yaml"
          grep -qx "defaultAuditImage: $REGISTRY/webaudit-lighthouse:$VERSION" "$RUNNER_TEMP/chart/values.yaml"
          helm package "$RUNNER_TEMP/chart" --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/out"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "$RUNNER_TEMP/out/webaudit-operator-$VERSION.tgz" "oci://$REGISTRY/charts"
