---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - webaudit.simpleit.sk
  resources:
  - webaudits
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - webaudit.simpleit.sk
  resources:
  - webaudits/finalizers
  verbs:
  - update
- apiGroups:
  - webaudit.simpleit.sk
  resources:
  - webaudits/status
  verbs:
  - get
  - patch
  - update
